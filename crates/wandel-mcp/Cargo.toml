[package]
name = "wandel-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "High-performance Model Context Protocol (MCP) server for Wandel (headless stdio/HTTP and Desktop UI)"

[dependencies]
wandel-core = { path = "../wandel-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
