name: Release (macOS, Linux & Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri & FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            nasm \
            ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Stage FFmpeg sidecars & run tests
        shell: bash
        run: |
          TARGET_TRIPLE="$(rustc -vV | awk '/host:/ { print $2 }')"
          mkdir -p src-tauri/binaries
          cp "$(which ffmpeg)" "src-tauri/binaries/ffmpeg-${TARGET_TRIPLE}"
          cp "$(which ffprobe)" "src-tauri/binaries/ffprobe-${TARGET_TRIPLE}"
          chmod +x "src-tauri/binaries/ffmpeg-${TARGET_TRIPLE}" "src-tauri/binaries/ffprobe-${TARGET_TRIPLE}"
          npm ci
          npm run test:coverage
          npm run build
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  build-desktop:
    name: Desktop Installer (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon (arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact_name: wandel-desktop-macos-arm64
          - label: macOS Intel (x64)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            artifact_name: wandel-desktop-macos-x64
          - label: Linux x64 (AppImage, deb, rpm)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
            artifact_name: wandel-desktop-linux-x64
          - label: Windows x64 (MSI, NSIS)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            artifact_name: wandel-desktop-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            nasm \
            xz-utils

      - name: Install macOS NASM for x64 AVIF assembly
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        run: brew install nasm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Download static FFmpeg & FFprobe sidecars (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries /tmp/ffmpeg-dl
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            ARCH="arm64"
          else
            ARCH="amd64"
          fi
          curl -fsSL "https://ffmpeg.martin-riedl.de/redirect/latest/macos/${ARCH}/release/ffmpeg.zip" -o /tmp/ffmpeg-dl/ffmpeg.zip
          curl -fsSL "https://ffmpeg.martin-riedl.de/redirect/latest/macos/${ARCH}/release/ffprobe.zip" -o /tmp/ffmpeg-dl/ffprobe.zip
          unzip -o /tmp/ffmpeg-dl/ffmpeg.zip -d /tmp/ffmpeg-dl
          unzip -o /tmp/ffmpeg-dl/ffprobe.zip -d /tmp/ffmpeg-dl
          mv /tmp/ffmpeg-dl/ffmpeg "src-tauri/binaries/ffmpeg-${{ matrix.target }}"
          mv /tmp/ffmpeg-dl/ffprobe "src-tauri/binaries/ffprobe-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/ffmpeg-${{ matrix.target }}" "src-tauri/binaries/ffprobe-${{ matrix.target }}"

      - name: Download static FFmpeg & FFprobe sidecars (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries /tmp/ffmpeg-dl
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o /tmp/ffmpeg-dl/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg-dl/ffmpeg.tar.xz -C /tmp/ffmpeg-dl --strip-components=1
          mv /tmp/ffmpeg-dl/bin/ffmpeg "src-tauri/binaries/ffmpeg-${{ matrix.target }}"
          mv /tmp/ffmpeg-dl/bin/ffprobe "src-tauri/binaries/ffprobe-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/ffmpeg-${{ matrix.target }}" "src-tauri/binaries/ffprobe-${{ matrix.target }}"

      - name: Download static FFmpeg & FFprobe sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries, $env:TEMP\ffmpeg-dl | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "$env:TEMP\ffmpeg-dl\ffmpeg.zip"
          Expand-Archive -Path "$env:TEMP\ffmpeg-dl\ffmpeg.zip" -DestinationPath "$env:TEMP\ffmpeg-dl" -Force
          $binDir = (Get-ChildItem -Path "$env:TEMP\ffmpeg-dl" -Directory | Select-Object -First 1).FullName + "\bin"
          Copy-Item "$binDir\ffmpeg.exe" "src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe"
          Copy-Item "$binDir\ffprobe.exe" "src-tauri/binaries/ffprobe-${{ matrix.target }}.exe"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & publish Tauri Desktop bundles (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Wandel v__VERSION__"
          releaseBody: "Download Wandel Desktop installers or standalone headless CLI/MCP binaries below for macOS (Apple Silicon & Intel), Linux (x64), and Windows (x64)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Tauri Desktop bundles (workflow_dispatch preview)
        if: github.event_name == 'workflow_dispatch'
        run: npx tauri build ${{ matrix.args }}

      - name: Upload Desktop bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore

  build-cli:
    name: Headless CLI & MCP (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: wandel-cli-macos-arm64.tar.gz
          - label: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: wandel-cli-macos-x64.tar.gz
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: wandel-cli-linux-x64.tar.gz
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: wandel-cli-windows-x64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux NASM for x64 AVIF assembly
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install macOS NASM for x64 AVIF assembly
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        run: brew install nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release CLI & MCP binary
        run: cargo build --release -p wandel-cli --target ${{ matrix.target }}

      - name: Package CLI archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist-cli
          tar -czf "dist-cli/${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" wandel
          (cd dist-cli && shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256")

      - name: Package CLI archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-cli | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/wandel.exe" -DestinationPath "dist-cli/${{ matrix.archive }}" -Force
          $hash = (Get-FileHash "dist-cli/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ascii "dist-cli/${{ matrix.archive }}.sha256"

      - name: Upload CLI & MCP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist-cli/*

      - name: Attach CLI archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-cli/*
          draft: true
