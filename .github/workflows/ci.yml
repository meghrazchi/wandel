name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (TypeScript, Vitest & Coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests with 100% utility coverage
        run: npm run test:coverage

      - name: Typecheck & production build
        run: npm run build

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/

  rust:
    name: Rust & Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri & FFmpeg dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            nasm \
            ffmpeg

      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Prepare FFmpeg sidecar binaries for Tauri build
        shell: bash
        run: |
          TARGET_TRIPLE="$(rustc -vV | awk '/host:/ { print $2 }')"
          mkdir -p src-tauri/binaries
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp "$(which ffmpeg)" "src-tauri/binaries/ffmpeg-${TARGET_TRIPLE}.exe"
            cp "$(which ffprobe)" "src-tauri/binaries/ffprobe-${TARGET_TRIPLE}.exe"
          else
            cp "$(which ffmpeg)" "src-tauri/binaries/ffmpeg-${TARGET_TRIPLE}"
            cp "$(which ffprobe)" "src-tauri/binaries/ffprobe-${TARGET_TRIPLE}"
            chmod +x "src-tauri/binaries/ffmpeg-${TARGET_TRIPLE}" "src-tauri/binaries/ffprobe-${TARGET_TRIPLE}"
          fi

      - name: Build frontend dist for Tauri context
        run: npm ci && npm run build

      - name: Clippy lint (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run full workspace tests
        run: cargo test --workspace -- --nocapture

  coverage:
    name: Rust Code Coverage (LLVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri & FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            nasm \
            ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - name: Prepare FFmpeg sidecars & frontend dist
        shell: bash
        run: |
          TARGET_TRIPLE="$(rustc -vV | awk '/host:/ { print $2 }')"
          mkdir -p src-tauri/binaries
          cp "$(which ffmpeg)" "src-tauri/binaries/ffmpeg-${TARGET_TRIPLE}"
          cp "$(which ffprobe)" "src-tauri/binaries/ffprobe-${TARGET_TRIPLE}"
          chmod +x "src-tauri/binaries/ffmpeg-${TARGET_TRIPLE}" "src-tauri/binaries/ffprobe-${TARGET_TRIPLE}"
          npm ci && npm run build

      - name: Generate LLVM coverage report
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          echo "### Rust Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: lcov.info
